[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-tunnel-cli"
version = "0.1.1"
description = "Guided local SSH tunnels using your existing OpenSSH configuration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]
dependencies = ["questionary==2.1.1"]

[project.urls]
Repository = "https://github.com/maneeshv/ssh-tunnel-cli"
Issues = "https://github.com/maneeshv/ssh-tunnel-cli/issues"

[project.scripts]
tunnel = "tunnel_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tunnel_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "design/", "README.md", "SPEC.md", "LICENSE", "pyproject.toml", "uv.lock"]
