[package]
name = "ssh-tunnel-cli-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Interactive SSH tunnels using native OpenSSH — Rust comparison build"
license = "MIT"
repository = "https://github.com/maneeshv/ssh-tunnel-cli"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
publish = false

[[bin]]
name = "tunnel-rs"
path = "src/main.rs"

[dependencies]
glob = "0.3"
inquire = { version = "=0.9.4", default-features = false, features = ["crossterm"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
