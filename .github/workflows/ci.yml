name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - name: Smoke test wheel and source archive
        run: |
          uv run --isolated --no-project --with dist/*.whl tunnel --version
          uv run --isolated --no-project --with dist/*.tar.gz tunnel --version

  typescript:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
      - name: Verify installed npm executable
        run: |
          npm install --prefix "$RUNNER_TEMP/tunnel-ts-smoke" --ignore-scripts ./ssh-tunnel-cli-ts-0.1.0.tgz
          "$RUNNER_TEMP/tunnel-ts-smoke/node_modules/.bin/tunnel-ts" --version

  rust:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.89.0 fmt --check
      - run: cargo +1.89.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.89.0 test --locked
      - name: Verify standalone executable
        run: |
          cargo +1.89.0 install --locked --path . --root "$RUNNER_TEMP/tunnel-rs-smoke"
          "$RUNNER_TEMP/tunnel-rs-smoke/bin/tunnel-rs" --version
          "$RUNNER_TEMP/tunnel-rs-smoke/bin/tunnel-rs" --help
